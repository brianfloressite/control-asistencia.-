{% extends "base.html" %}
{% block titulo %}Error {{ codigo }}{% endblock %}
{% block encabezado %}Error {{ codigo }}{% endblock %}
{% block contenido %}
<div class="card"><div class="card-body text-center py-5">
  <i class="bi bi-{{ 'shield-lock' if codigo == 403 else 'signpost-split' }} display-4 text-muted"></i>
  <p class="lead mt-3">{{ mensaje }}</p>
  <a class="btn btn-primary" href="{{ url_for('auth.inicio') }}">Volver al inicio</a>
</div></div>
{% endblock %}
{% block publico %}<div class="container py-5 text-center"><p class="lead">{{ mensaje }}</p><a href="{{ url_for('auth.login') }}">Iniciar sesión</a></div>{% endblock %}
