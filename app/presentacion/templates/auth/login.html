{% extends "base.html" %}
{% block titulo %}Iniciar sesión{% endblock %}
{% block publico %}
<div class="login-wrap px-3">
  <div class="card login-card shadow">
    <div class="card-body p-4 p-md-5">
      <div class="text-center mb-4">
        <i class="bi bi-shield-check display-5 text-primary"></i>
        <h1 class="h4 mt-2 mb-0">Funeraria Del Castillo</h1>
        <p class="text-muted small">Sistema de Control de Asistencia</p>
      </div>
      {% include "_mensajes.html" %}
      <form method="post" autocomplete="off" novalidate>
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="mb-3"><label class="form-label" for="username">Usuario</label>
          <input class="form-control" id="username" name="username" required autofocus value="{{ request.form.username }}"></div>
        <div class="mb-4"><label class="form-label" for="password">Contraseña</label>
          <input class="form-control" id="password" name="password" type="password" required></div>
        <button class="btn btn-primary w-100">Ingresar</button>
      </form>
      <p class="text-center text-muted small mt-4 mb-0"><i class="bi bi-lock"></i> Acceso protegido · la cuenta se bloquea tras 5 intentos fallidos</p>
    </div>
  </div>
</div>
{% endblock %}
