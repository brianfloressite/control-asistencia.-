{% extends "base.html" %}
{% block titulo %}Reportar falla{% endblock %}
{% block encabezado %}Reportar falla del reloj biométrico{% endblock %}
{% block contenido %}
<div class="movil mx-auto"><form method="post" class="card card-body">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <label class="form-label fw-semibold">Tipo de falla</label>
  {% for clave, texto in tipos.items() %}
    <label class="border rounded p-3 mb-2 d-flex gap-2 align-items-center"><input class="form-check-input mt-0" type="radio" name="tipo" value="{{ clave }}" {{ 'checked' if loop.first }}> {{ texto }}</label>
  {% endfor %}
  <label class="form-label mt-2">Reloj</label>
  <select class="form-select mb-2" name="id_reloj">{% for r in relojes %}<option value="{{ r.id_reloj }}">{{ r.nombre }}</option>{% endfor %}</select>
  <label class="form-label">Descripción (opcional)</label>
  <textarea class="form-control mb-3" name="descripcion" rows="3" maxlength="255" placeholder="Describa lo ocurrido…"></textarea>
  <button class="btn btn-primary">Enviar reporte</button>
  <a class="btn btn-outline-secondary mt-2" href="{{ url_for('marcacion.marcar') }}">Cancelar</a>
</form></div>
{% endblock %}
