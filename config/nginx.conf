# Nginx como proxy inverso con HTTPS para el Sistema de Control de Asistencia
# Copiar a /etc/nginx/sites-available/asistencia y enlazar en sites-enabled
server {
    listen 80;
    server_name asistencia.tudominio.pe;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name asistencia.tudominio.pe;

    ssl_certificate     /etc/letsencrypt/live/asistencia.tudominio.pe/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/asistencia.tudominio.pe/privkey.pem;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location /static/ {
        alias /opt/control-asistencia/app/presentacion/static/;
        expires 7d;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
